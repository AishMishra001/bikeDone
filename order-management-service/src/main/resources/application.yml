spring:
  application:
    name: vehicle-management-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE:dev}}

  config:
    import: optional:file:./config/${spring.profiles.active}/secrets.properties

  jackson:
    time-zone: Asia/Kolkata

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    connect-retries: 10
    table: vehicle_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.bikedone.vehicle_management_service: INFO

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}