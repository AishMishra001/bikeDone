spring:
  datasource:
    url: ${DB_URL:${UMS_DB_URL}}
    username: ${DB_USERNAME:${UMS_DB_USERNAME}}
    password: ${DB_PASSWORD:${UMS_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
