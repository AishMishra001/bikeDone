spring:
  application:
    name: user-management-service

  jackson:
    time-zone: Asia/Kolkata

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${SPRING_PROFILE:dev}}

  config:
    import: optional:file:./config/${spring.profiles.active}/secrets.properties

server:
  port: ${PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  email-verification-token-expiration: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION}
  password-reset-token-expiration: ${PASSWORD_RESET_TOKEN_EXPIRATION}

email:
  api-key: ${BREVO_API_KEY}
  from-email: ${BREVO_FROM_EMAIL}
  from-name: ${BREVO_FROM_NAME}
  frontend-url: ${FRONTEND_URL}