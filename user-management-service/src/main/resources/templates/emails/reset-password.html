<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body style="background:#f5f7fb;padding:30px;">

<div style="max-width:600px;margin:auto;background:white;border-radius:8px;overflow:hidden;box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">

    <div th:replace="~{fragments/header :: header}"></div>

    <div style="padding:30px;font-family:Arial,sans-serif;color:#1f2937;">

        <h2 style="color:#111827;margin-top:0;">Password Reset 🔒</h2>

        <p>Hello <b th:text="${name}"></b>,</p>

        <p>
            We received a request to reset your password for your Bike Done account.
        </p>

        <div style="text-align:center;margin:30px 0;">
            <a th:href="${resetUrl}"
               style="background:#f97316;
                      color:white;
                      text-decoration:none;
                      padding:14px 28px;
                      border-radius:6px;
                      font-weight:bold;
                      display:inline-block;">
                Reset Password
            </a>
        </div>

        <div style="background:#f3f4f6;padding:16px;border-radius:6px;margin-top:20px;">
            <p style="margin:0 0 8px 0;font-size:13px;color:#4b5563;font-weight:bold;">Your Reset Token (Copy & paste into app):</p>
            <code th:text="${token}" style="font-size:14px;background:#e5e7eb;padding:8px 12px;border-radius:4px;display:block;word-break:break-all;color:#111827;font-family:monospace;"></code>
        </div>

        <p style="font-size:12px;color:#6b7280;margin-top:20px;word-break:break-all;">
            Direct link: <a th:href="${resetUrl}" th:text="${resetUrl}" style="color:#f97316;"></a>
        </p>

        <p style="font-size:13px;color:#9ca3af;margin-top:24px;">
            If you didn't request this, simply ignore this email.
        </p>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
